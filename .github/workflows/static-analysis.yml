name: Static Analysis

on:
  push:
    branches: [ main ]
  # Deliberately unfiltered: restricting to `branches: [ main ]` skips any pull
  # request opened against another branch, so a stacked pull request gets no
  # checks at all until its parent merges and GitHub retargets it.
  pull_request:

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  complexity:
    name: Measure & track complexity
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      # Required by octocov to read previous reports and write the current report
      # when the artifact datastore is used.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Measure complexity (cccc)
        id: cccc
        # Thresholds (max-cognitive / max-cyclomatic) live in .cccc.toml; cccc
        # exits non-zero when a function breaches them. continue-on-error lets
        # the summary/octocov steps below still run and publish the report,
        # and the "Enforce complexity thresholds" step at the end fails the
        # job based on this step's recorded outcome.
        continue-on-error: true
        uses: moznion/cccc-action@v1
        with:
          path: .
          output-file: cccc.json
          config: .cccc.toml

      - name: Build octocov custom metrics
        run: |
          jq '{
            key: "code_complexity",
            name: "Code Complexity (Go)",
            metrics: [
              { key: "function_count", name: "Function count", value: .summary.function_count },
              { key: "cognitive_sum", name: "Cognitive: total", value: .summary.cognitive.sum },
              { key: "cognitive_max", name: "Cognitive: max", value: .summary.cognitive.max },
              { key: "cognitive_median", name: "Cognitive: median", value: .summary.cognitive.median },
              { key: "cognitive_p90", name: "Cognitive: p90", value: .summary.cognitive.p90 },
              { key: "cyclomatic_sum", name: "Cyclomatic: total", value: .summary.cyclomatic.sum },
              { key: "cyclomatic_max", name: "Cyclomatic: max", value: .summary.cyclomatic.max },
              { key: "cyclomatic_median", name: "Cyclomatic: median", value: .summary.cyclomatic.median },
              { key: "cyclomatic_p90", name: "Cyclomatic: p90", value: .summary.cyclomatic.p90 }
            ]
          }' cccc.json > custom_metrics_complexity.json
          echo "::group::custom_metrics_complexity.json"
          cat custom_metrics_complexity.json
          echo "::endgroup::"

      - name: Append top complex functions to job summary
        run: |
          {
            echo "## Top 20 functions by Cognitive Complexity"
            echo ""
            echo "| Cognitive | Cyclomatic | Function | File:Line |"
            echo "| --- | --- | --- | --- |"
            jq -r '
              [ .files[] | .path as $p | .functions[] | recurse(.children[]?)
              | { path: $p, name: .name, line: .line, cognitive: .cognitive, cyclomatic: .cyclomatic } ]
              | sort_by(-.cognitive) | .[:20][]
              | "| \(.cognitive) | \(.cyclomatic) | `\(.name)` | \(.path):\(.line) |"
            ' cccc.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run octocov
        # Skip for forked pull requests where the workflow token lacks comment permissions.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: k1LoW/octocov-action@v1.5.2
        with:
          config: .octocov.complexity.yml
        env:
          OCTOCOV_CUSTOM_METRICS_COMPLEXITY: custom_metrics_complexity.json

      - name: Enforce complexity thresholds
        if: steps.cccc.outcome == 'failure'
        run: |
          echo "cccc reported a function exceeding the max-cognitive/max-cyclomatic thresholds in .cccc.toml." >&2
          exit 1
