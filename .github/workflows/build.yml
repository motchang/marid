name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required by octocov to read previous reports and write the current report
      # when the artifact datastore is used.
      actions: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: |
        mkdir -p coverage
        # -coverpkg takes an explicit package list rather than ./...: that pattern
        # walks into internal/testsqlmock, which the go-sqlmock replace directive
        # points at, and measures the test double as if it were product code.
        # go list ./... omits it because it is a separate module.
        #
        # -count=1 disables the test result cache. Under -coverpkg every test
        # binary emits block definitions for packages it does not even link, and
        # those are not part of the cache key, so a cache restored from an older
        # commit replays the previous layout of any file changed since. The merged
        # profile then holds two incompatible block sets per file and counts both
        # in the denominator.
        go test -coverpkg="$(go list ./... | paste -sd, -)" ./... -v \
          -count=1 -coverprofile=coverage/coverage.out -timeout=5m

    - name: Verify coverage threshold
      run: |
        ./scripts/check-coverage-threshold.sh coverage/coverage.out 30

    - name: Generate coverage report
      run: go tool cover -html=coverage/coverage.out -o coverage/coverage.html

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: coverage

    - name: Run octocov
      # Skip for forked pull requests where the workflow token lacks comment permissions.
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      uses: k1LoW/octocov-action@v1.5.1
      with:
        config: .octocov.yml
